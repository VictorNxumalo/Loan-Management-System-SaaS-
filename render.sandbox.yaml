# Sandbox API + Redis on Render — deploys from the `staging` branch only.
# See docs/sandbox-environment.md. Production uses render.production.yaml (main branch).

services:
  - type: redis
    name: lms-sandbox-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: lms-sandbox-api
    runtime: docker
    branch: staging
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_EMAIL_VERIFICATION
        value: "false"
      - key: SUPABASE_STORAGE_BUCKET
        value: lms-documents
      - key: TRIAL_DAYS
        value: "14"
      - key: CRON_OVERDUE_ENABLED
        value: "true"
      - key: CRON_REMINDER_ENABLED
        value: "true"
      - key: STAGING_ALLOW_VERCEL_CORS
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: lms-sandbox-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: LMS
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: sandbox
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
