# Production API + Redis on Render — deploys from `main` only.
# Apply as a separate Blueprint from render.sandbox.yaml. See docs/sandbox-environment.md.

services:
  - type: redis
    name: lms-production-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: lms-production-api
    runtime: docker
    branch: main
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_EMAIL_VERIFICATION
        value: "false"
      - key: SUPABASE_STORAGE_BUCKET
        value: lms-documents
      - key: TRIAL_DAYS
        value: "14"
      - key: CRON_OVERDUE_ENABLED
        value: "true"
      - key: CRON_REMINDER_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: lms-production-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
